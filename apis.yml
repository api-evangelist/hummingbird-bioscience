aid: hummingbird-bioscience
name: Hummingbird Bioscience
description: >-
  Hummingbird Bioscience is a clinical-stage precision biotherapeutics company headquartered at The
  Galen, Singapore Science Park, with US operations, discovering and developing antibody-based
  medicines — including next-generation antibody-drug conjugates (ADCs) — for hard-to-treat cancers
  and autoimmune disease. Its Rational Antibody Discovery (RAD) platform pairs computational target
  and epitope modelling with proprietary immunization strategies and Abvantage mice, and is combined
  with in-house linker-payload chemistry to engineer epitope-specific, high-affinity antibodies.
  Clinical programs include HMBD-001 (anti-HER3 monoclonal antibody) and HMBD-501 (HER3-targeted
  ADC, first patient dosed January 2026); HMBD-002 (anti-VISTA) was licensed to Percheron
  Therapeutics in 2025 and further antibodies were licensed to Immunome. The company sells drug
  programs and partnerships, not software: it publishes no developer program, API, SDK or
  machine-readable contract.
